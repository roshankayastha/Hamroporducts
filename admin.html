<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamro Products | Admin Portal</title>
  
  <!-- Remix Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  
  <!-- Joyful CSS Stylesheet (Shared/extended styles) -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Admin specific layouts */
    .admin-container {
      max-width: 1300px;
      margin: 40px auto;
      padding: 0 24px;
    }
    
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
    }
    @media (min-width: 992px) {
      .admin-grid {
        grid-template-columns: 1.4fr 1fr;
      }
    }

    .admin-card {
      background-color: var(--white);
      border-radius: var(--border-radius);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      padding: 30px;
      margin-bottom: 30px;
    }

    .admin-card-title {
      font-size: 1.5rem;
      color: var(--primary-dark);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    /* Table layout */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }
    .admin-table th {
      background-color: var(--bg-light);
      padding: 12px 16px;
      font-weight: 700;
      color: var(--text-main);
      border-bottom: 2px solid var(--border-color);
    }
    .admin-table td {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }
    .admin-table tr:hover {
      background-color: rgba(230, 28, 36, 0.01);
    }

    .prod-thumb {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .badge-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 700;
      background-color: #ffe0b2;
      color: #e65100;
    }
    .badge-status.completed {
      background-color: #c8e6c9;
      color: #2e7d32;
    }

    .action-btn-group {
      display: flex;
      gap: 8px;
    }
    .btn-small {
      padding: 8px 12px;
      font-size: 0.8rem;
      border-radius: 10px;
    }
    .btn-danger {
      background-color: #dc3545;
      color: white;
    }
    .btn-danger:hover {
      background-color: #c82333;
    }

    .order-items-list {
      font-size: 0.85rem;
      color: var(--text-muted);
      padding-left: 16px;
    }

    /* Modal Form elements */
    .admin-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 400;
      align-items: center;
      justify-content: center;
    }
    .admin-modal.open {
      display: flex;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo-area" id="nav-logo">
        <img src="assets/logo.jpg" alt="Hamro Products Logo" class="logo-img">
        <span class="logo-text">Hamro Products</span>
      </a>
      <span style="font-weight: 700; background: var(--primary-light); color: white; padding: 4px 12px; border-radius: 50px; font-size: 0.85rem;">Admin Panel</span>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-outline"><i class="ri-home-4-line"></i> Main Store</a>
        <button onclick="adminLogout()" class="btn btn-primary btn-small">Logout</button>
      </div>
    </div>
  </header>

  <main style="margin-top: 105px;">
    <div class="admin-container">
      
      <!-- Grid Layout for Product management and orders -->
      <div class="admin-grid">
        
        <!-- Left: Product List Management -->
        <div>
          <div class="admin-card">
            <h2 class="admin-card-title"><i class="ri-store-2-line"></i> Product Inventory</h2>
            <div class="table-wrapper">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Image</th>
                    <th>Product Details</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="inventory-tbody">
                  <!-- Dynamic product rows -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Right: Add New Product Form -->
        <div>
          <div class="admin-card">
            <h2 class="admin-card-title"><i class="ri-add-circle-line"></i> Add New Product</h2>
            <form id="add-product-form" onsubmit="handleAddProduct(event)">
              <div class="form-group">
                <label for="prod-name">Product Name</label>
                <input type="text" id="prod-name" class="form-control" placeholder="E.g., Mountain Wild Honey" required>
              </div>
              <div class="form-group-row">
                <div class="form-group">
                  <label for="prod-category">Category</label>
                  <select id="prod-category" class="form-control" required style="height: 48px;">
                    <option value="Tea & Coffee">Tea & Coffee</option>
                    <option value="Gourmet">Gourmet & Spices</option>
                    <option value="Artisanal">Artisanal Crafts</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="prod-price">Price ($)</label>
                  <input type="number" step="0.01" id="prod-price" class="form-control" placeholder="19.99" required>
                </div>
              </div>
              <div class="form-group-row">
                <div class="form-group">
                  <label for="prod-tag">Marketing Tag</label>
                  <input type="text" id="prod-tag" class="form-control" placeholder="E.g., New Arrival">
                </div>
                <div class="form-group">
                  <label for="prod-rating">Initial Rating</label>
                  <input type="number" step="0.1" min="1" max="5" id="prod-rating" class="form-control" value="5.0">
                </div>
              </div>
              <div class="form-group">
                <label for="prod-image">Image URL</label>
                <input type="url" id="prod-image" class="form-control" placeholder="https://images.unsplash.com/..." required>
              </div>
              <div class="form-group">
                <label for="prod-desc">Description</label>
                <textarea id="prod-desc" class="form-control" placeholder="Detailed product story..." rows="3" required style="resize: vertical;"></textarea>
              </div>
              
              <!-- Specifications Sub-group -->
              <div style="border: 1px solid var(--border-color); padding: 16px; border-radius: 12px; margin-bottom: 24px;">
                <h4 style="margin-bottom: 12px; color: var(--primary); font-size: 0.95rem;">Product Specifications</h4>
                <div class="form-group">
                  <label for="spec-origin">Origin Location</label>
                  <input type="text" id="spec-origin" class="form-control" placeholder="E.g., Ilam, Nepal">
                </div>
                <div class="form-group">
                  <label for="spec-details">Detail Attribute (Weight / Dimensions)</label>
                  <input type="text" id="spec-details" class="form-control" placeholder="E.g., 200g, Set of 4">
                </div>
              </div>

              <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="ri-add-line"></i> Save Product</button>
            </form>
          </div>
        </div>

      </div>

      <!-- Bottom Log: Customer Orders -->
      <div class="admin-card">
        <h2 class="admin-card-title"><i class="ri-file-list-3-line"></i> Customer Orders Log</h2>
        <div class="table-wrapper">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Customer Details</th>
                <th>Shipping Address</th>
                <th>Ordered Items</th>
                <th>Total Paid</th>
                <th>Date / Time</th>
              </tr>
            </thead>
            <tbody id="orders-tbody">
              <!-- Dynamic orders injected here -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- Edit Product Modal -->
  <div class="admin-modal" id="edit-modal">
    <div class="modal-bg" onclick="closeEditModal()"></div>
    <div class="modal-wrapper" style="max-width: 600px; padding: 30px;">
      <h2 class="admin-card-title"><i class="ri-edit-line"></i> Edit Product</h2>
      <button class="close-btn modal-close-btn" onclick="closeEditModal()">&times;</button>
      <form id="edit-product-form" onsubmit="handleSaveEdit(event)">
        <input type="hidden" id="edit-prod-id">
        <div class="form-group">
          <label for="edit-prod-name">Product Name</label>
          <input type="text" id="edit-prod-name" class="form-control" required>
        </div>
        <div class="form-group-row">
          <div class="form-group">
            <label for="edit-prod-category">Category</label>
            <select id="edit-prod-category" class="form-control" required style="height: 48px;">
              <option value="Tea & Coffee">Tea & Coffee</option>
              <option value="Gourmet">Gourmet & Spices</option>
              <option value="Artisanal">Artisanal Crafts</option>
            </select>
          </div>
          <div class="form-group">
            <label for="edit-prod-price">Price ($)</label>
            <input type="number" step="0.01" id="edit-prod-price" class="form-control" required>
          </div>
        </div>
        <div class="form-group">
          <label for="edit-prod-tag">Marketing Tag</label>
          <input type="text" id="edit-prod-tag" class="form-control">
        </div>
        <div class="form-group">
          <label for="edit-prod-image">Image URL</label>
          <input type="url" id="edit-prod-image" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="edit-prod-desc">Description</label>
          <textarea id="edit-prod-desc" class="form-control" rows="3" required></textarea>
        </div>
        
        <div style="border: 1px solid var(--border-color); padding: 16px; border-radius: 12px; margin-bottom: 24px;">
          <h4 style="margin-bottom: 12px; color: var(--primary); font-size: 0.95rem;">Product Specifications</h4>
          <div class="form-group">
            <label for="edit-spec-origin">Origin Location</label>
            <input type="text" id="edit-spec-origin" class="form-control">
          </div>
          <div class="form-group">
            <label for="edit-spec-details">Detail Attribute (Weight / Dimensions)</label>
            <input type="text" id="edit-spec-details" class="form-control">
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Save Changes</button>
      </form>
    </div>
  </div>

  <script>
    // --- Auth Check ---
    const adminUser = JSON.parse(localStorage.getItem('hamro_user'));
    const adminToken = localStorage.getItem('hamro_token');
    
    if (!adminUser || adminUser.role !== 'admin' || !adminToken) {
      alert("Unauthorized access. Redirecting to home page.");
      window.location.href = 'index.html';
    }

    function adminLogout() {
      localStorage.removeItem('hamro_user');
      localStorage.removeItem('hamro_token');
      window.location.href = 'index.html';
    }

    const authHeaders = {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${adminToken}`
    };

    // Fetch Products and Orders from Backend APIs
    async function loadDashboardData() {
      try {
        // Load products
        const prodRes = await fetch('/api/products');
        const products = await prodRes.json();
        renderInventoryTable(products);

        // Load orders
        const orderRes = await fetch('/api/orders', { headers: authHeaders });
        const orders = await orderRes.json();
        renderOrdersTable(orders);
      } catch (err) {
        console.error('Error loading admin dashboard data:', err);
      }
    }

    // Render Product Inventory Table
    function renderInventoryTable(products) {
      const tbody = document.getElementById('inventory-tbody');
      if (!tbody) return;

      tbody.innerHTML = products.map(prod => `
        <tr>
          <td><img src="${prod.image}" alt="${prod.name}" class="prod-thumb"></td>
          <td>
            <div style="font-weight: 700; color: var(--text-main);">${prod.name}</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">ID: ${prod.id}</div>
          </td>
          <td>${prod.category}</td>
          <td style="font-weight: 700; color: var(--primary);">$${prod.price.toFixed(2)}</td>
          <td>
            <div class="action-btn-group">
              <button class="btn btn-primary btn-small" onclick="openEditModal(${JSON.stringify(prod).replace(/"/g, '&quot;')})"><i class="ri-edit-line"></i> Edit</button>
              <button class="btn btn-danger btn-small" onclick="handleDeleteProduct(${prod.id})"><i class="ri-delete-bin-line"></i> Delete</button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    // Render Customer Orders Table
    function renderOrdersTable(orders) {
      const tbody = document.getElementById('orders-tbody');
      if (!tbody) return;

      if (orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">No customer orders placed yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = orders.map(order => {
        const itemsList = order.items.map(item => `<li>${item.name} (Qty: ${item.quantity})</li>`).join("");
        const dateStr = new Date(order.created_at).toLocaleString();

        return `
          <tr>
            <td style="font-weight: 700;">#${order.id}</td>
            <td>
              <div style="font-weight: 700;">${order.customer_name}</div>
              <div style="font-size: 0.85rem; color: var(--text-muted);">${order.customer_email}</div>
            </td>
            <td>${order.address}, ${order.city}, ${order.zip}</td>
            <td><ul class="order-items-list">${itemsList}</ul></td>
            <td style="font-weight: 700; color: var(--primary);">$${order.total.toFixed(2)}</td>
            <td style="font-size: 0.85rem; color: var(--text-muted);">${dateStr}</td>
          </tr>
        `;
      }).join("");
    }

    // Add Product Form submit
    async function handleAddProduct(e) {
      e.preventDefault();
      const productData = {
        name: document.getElementById('prod-name').value.trim(),
        category: document.getElementById('prod-category').value,
        price: parseFloat(document.getElementById('prod-price').value),
        tag: document.getElementById('prod-tag').value.trim(),
        rating: parseFloat(document.getElementById('prod-rating').value || 5.0),
        reviews: 0,
        image: document.getElementById('prod-image').value.trim(),
        description: document.getElementById('prod-desc').value.trim(),
        specs: {
          origin: document.getElementById('spec-origin').value.trim(),
          weight: document.getElementById('spec-details').value.trim()
        }
      };

      try {
        const res = await fetch('/api/products', {
          method: 'POST',
          headers: authHeaders,
          body: JSON.stringify(productData)
        });
        if (res.ok) {
          alert('Product added successfully!');
          document.getElementById('add-product-form').reset();
          loadDashboardData();
        } else {
          const err = await res.json();
          alert('Error adding product: ' + err.error);
        }
      } catch (err) {
        alert('Network error connecting to backend.');
      }
    }

    // Delete Product API call
    async function handleDeleteProduct(id) {
      if (!confirm('Are you sure you want to delete this product?')) return;
      try {
        const res = await fetch(`/api/products/${id}`, { 
          method: 'DELETE',
          headers: authHeaders 
        });
        if (res.ok) {
          alert('Product deleted successfully.');
          loadDashboardData();
        } else {
          alert('Error deleting product.');
        }
      } catch (err) {
        alert('Network error.');
      }
    }

    // Edit Modal helpers
    function openEditModal(prod) {
      document.getElementById('edit-prod-id').value = prod.id;
      document.getElementById('edit-prod-name').value = prod.name;
      document.getElementById('edit-prod-category').value = prod.category;
      document.getElementById('edit-prod-price').value = prod.price;
      document.getElementById('edit-prod-tag').value = prod.tag || "";
      document.getElementById('edit-prod-image').value = prod.image;
      document.getElementById('edit-prod-desc').value = prod.description;
      document.getElementById('edit-spec-origin').value = prod.specs ? (prod.specs.origin || "") : "";
      document.getElementById('edit-spec-details').value = prod.specs ? (prod.specs.weight || prod.specs.material || prod.specs.diameter || "") : "";

      document.getElementById('edit-modal').classList.add('open');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.remove('open');
    }

    async function handleSaveEdit(e) {
      e.preventDefault();
      const id = document.getElementById('edit-prod-id').value;
      const updatedData = {
        name: document.getElementById('edit-prod-name').value.trim(),
        category: document.getElementById('edit-prod-category').value,
        price: parseFloat(document.getElementById('edit-prod-price').value),
        tag: document.getElementById('edit-prod-tag').value.trim(),
        image: document.getElementById('edit-prod-image').value.trim(),
        description: document.getElementById('edit-prod-desc').value.trim(),
        specs: {
          origin: document.getElementById('edit-spec-origin').value.trim(),
          weight: document.getElementById('edit-spec-details').value.trim()
        }
      };

      try {
        const res = await fetch(`/api/products/${id}`, {
          method: 'PUT',
          headers: authHeaders,
          body: JSON.stringify(updatedData)
        });
        if (res.ok) {
          alert('Changes saved successfully!');
          closeEditModal();
          loadDashboardData();
        } else {
          alert('Error saving modifications.');
        }
      } catch (err) {
        alert('Network error.');
      }
    }

    document.addEventListener("DOMContentLoaded", loadDashboardData);
  </script>
</body>
</html>
